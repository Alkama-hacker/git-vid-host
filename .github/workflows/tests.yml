name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install dev harness
        run: npm install --no-audit --no-fund
      - name: unit checks (codec + VM + CLI)
        run: |
          export GVH_PHP_MODE=wasm
          node tests/codec_test.mjs
          node tests/vm_selftest.mjs
          python3 src/gvh.py inspect examples/demo/index.html
          python3 src/gvh.py inspect tests/fixtures/simple.html --json > /dev/null
      - name: full acceptance suite
        run: bash tests/run_all.sh
