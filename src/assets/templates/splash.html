<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>{{TITLE}}</title>
<link rel="icon" href="{{FAVICON}}">
<style>
  :root{--a:#7c5cff;--b:#00e5ff;--bg:#060812;--tx:#e8ecff}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;background:
    radial-gradient(55% 55% at 18% 12%,rgba(124,92,255,.24) 0%,transparent 62%),
    radial-gradient(50% 50% at 86% 88%,rgba(0,229,255,.16) 0%,transparent 60%),
    radial-gradient(45% 45% at 60% 50%,rgba(124,92,255,.10) 0%,transparent 70%);
    pointer-events:none}
  body::after{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);
    background-size:26px 26px;mask-image:radial-gradient(circle at 50% 50%,transparent 30%,#000 78%);opacity:.28;pointer-events:none}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center;z-index:2}
  .mark{position:relative;width:112px;height:112px;display:grid;place-items:center;filter:drop-shadow(0 18px 40px rgba(124,92,255,.4))}
  .mark .ring{position:absolute;inset:0;border-radius:34px;border:1.5px solid rgba(255,255,255,.14);transform:rotate(45deg);animation:tilt 6s ease-in-out infinite}
  .mark .ring:nth-child(2){inset:14px;border-color:rgba(0,229,255,.35);animation-delay:-2s}
  .mark .ring:nth-child(3){inset:28px;border-color:rgba(124,92,255,.55);animation-delay:-4s}
  @keyframes tilt{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(225deg) scale(.9)}}
  .mark .core{width:44px;height:44px;border-radius:14px;background:linear-gradient(140deg,var(--a),var(--b));box-shadow:0 0 34px rgba(124,92,255,.8);display:grid;place-items:center;font-size:20px;animation:beat 1.8s ease-in-out infinite}
  @keyframes beat{50%{transform:scale(.9);box-shadow:0 0 18px rgba(0,229,255,.6)}}
  .ttl{font-size:clamp(18px,3.8vw,24px);font-weight:650;letter-spacing:-.01em}
  .sub{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:#8b97c9;margin-top:-12px}
  .bar{width:min(78vw,340px);height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;position:relative}
  .bar i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 18px rgba(0,229,255,.55);transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:shine 2.2s infinite}
  @keyframes shine{to{transform:translateX(100%)}}
  .ok{font-size:11px;letter-spacing:.16em;color:#6f7ba8}
  .lock{display:inline-flex;gap:7px;align-items:center;font-size:10.5px;letter-spacing:.16em;color:#aab6e6;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.04)}
  .dot{width:6px;height:6px;border-radius:50%;background:#00e5ff;box-shadow:0 0 10px #00e5ff;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.2}}
  .foot{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:9.5px;letter-spacing:.24em;color:#4d557a;z-index:2}
  .err{display:none;max-width:min(92vw,460px);background:rgba(255,60,90,.08);border:1px solid rgba(255,60,90,.3);border-radius:16px;padding:18px 20px;font-size:13px;line-height:1.6;color:#ffc7d1;text-align:left}
  .err b{color:#ff8ba0}
  .retry{display:inline-flex;margin-top:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:9px 16px;border-radius:10px;font:inherit;font-size:12px;cursor:pointer}
  .retry:hover{background:rgba(255,255,255,.14)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="core">🛡</span></div>
  <div>
    <div class="ttl">{{TITLE}}</div>
    <div class="sub">Decrypting secure layers</div>
  </div>
  <div class="bar"><i id="pbar"></i></div>
  <div class="ok" id="pmsg">verifying shield integrity…</div>
  <div class="lock"><i class="dot"></i> GVH SHIELD · END-TO-END SEALED</div>
  <div class="err" id="err"><b>Protected page could not be unlocked.</b><div id="errtxt"></div><button class="retry" id="retry" type="button">Reload page</button></div>
</div>
<div class="foot">SECURED BY @SHACKER_ENCRYPTION_bot</div>
<noscript><style>.wrap,.foot{display:none}</style><div style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center"><div><h1 style="font-size:22px;margin-bottom:10px">JavaScript required</h1><p style="color:#9aa5cf;font-size:14px">This protected page needs JavaScript to unlock its secure layers.</p></div></div></noscript>
<script>@@SCRIPT@@</script>
</body>
</html>
